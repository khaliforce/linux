%YAML 1.2
---
$id: http://devicetree.org/schemas/net/wireless/realtek,rtl8723ds.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek RTL8723DS SDIO Wi-Fi

maintainers:
  - khaliforce <kforce@gmail.com>

description:
  The RTL8723DS provides Wi-Fi over SDIO.

allOf:
  - $ref: wireless-controller.yaml#

properties:
  compatible:
    const: realtek,rtl8723ds

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  interrupt-names:
    const: host-wake

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    mmc {
        #address-cells = <1>;
        #size-cells = <0>;

        wifi@1 {
            compatible = "realtek,rtl8723ds";
            reg = <1>;
            interrupt-parent = <&gpio>;
            interrupts = <10 IRQ_TYPE_LEVEL_LOW>;
            interrupt-names = "host-wake";
        };
    };
