%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/allwinner,sun20i-d1-analog-ldos.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Allwinner D1 Analog LDOs

maintainers:
  - Samuel Holland <samuel@sholland.org>

description:
  The codec power register controls the analog and headphone LDOs.
  The SID bandgap trim cell supplies the reference calibration.

properties:
  compatible:
    const: allwinner,sun20i-d1-analog-ldos

  reg:
    maxItems: 1

  nvmem-cells:
    maxItems: 1

  nvmem-cell-names:
    const: bg_trim

  aldo:
    type: object
    $ref: regulator.yaml#
    properties:
      vdd33-supply: true
    unevaluatedProperties: false

  hpldo:
    type: object
    $ref: regulator.yaml#
    properties:
      hpldoin-supply: true
    unevaluatedProperties: false

required:
  - compatible
  - reg
  - nvmem-cells
  - nvmem-cell-names

additionalProperties: false
...
